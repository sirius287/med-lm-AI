[project]
name = "medlm-foundation"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=44,<49",
  "Pillow>=11.1,<13",
  "email-validator>=2.2,<3",
  "tzdata>=2026.4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["services/api", "packages/backend_domain"]
testpaths = ["services/api/tests"]
markers = ["database: requires MEDLM_TEST_DATABASE_URL pointing to a disposable migrated PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
