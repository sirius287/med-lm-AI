name: Engineering preview checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: services/api:packages/backend_domain
      MEDLM_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.6'
      - run: uv sync --frozen
      - name: Install PostgreSQL 18 binaries on this disposable runner
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-18
      - run: uv run ruff check services packages database scripts
      - run: uv run ruff format --check services packages database scripts
      - run: uv run --with PyYAML==6.0.3 python scripts/check_release_config.py
      - run: uv run --with PyYAML==6.0.3 python scripts/audit_flutter_dependencies.py
      - name: Guarded setup smoke test on a new disposable cluster
        run: uv run python scripts/test_backend.py --pg-bin /usr/lib/postgresql/18/bin --setup-only
      - name: Audit locked backend dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file /tmp/medlm-requirements.txt >/dev/null
          uv tool run --from pip-audit==2.9.0 pip-audit --no-deps --disable-pip --progress-spinner off -r /tmp/medlm-requirements.txt
      - name: Database, migration, RLS and backend regressions
        run: uv run python scripts/test_backend.py --pg-bin /usr/lib/postgresql/18/bin
      - name: API and fixture parity
        run: |
          uv run python scripts/export_contract.py --check
          uv run python scripts/export_contract.py --synthetic --check
          uv run python scripts/export_contract.py --analysis --check
          uv run python scripts/generate_manual_client.py --check
          uv run python scripts/generate_analysis_client.py --check
          uv run python scripts/generate_synthetic_catalog.py --check
          uv run python scripts/check_localization.py
          uv run python scripts/check_repository.py
          git diff --check
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/medlm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: Generated localization bindings remain current
        run: git diff --exit-code -- lib/l10n/app_localizations*.dart
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build web --release --dart-define=APP_ENV=production --no-web-resources-cdn
      - run: flutter build apk --debug
